# Auto-deploy naar de VPS bij elke push naar main.
#
# Vereiste repo-secrets (Settings -> Secrets and variables -> Actions):
#   TS_OAUTH_CLIENT_ID  - Tailscale OAuth Client ID
#   TS_OAUTH_SECRET     - Tailscale OAuth Client secret
#   SSH_HOST            - Tailscale-hostname of 100.x-IP van de VPS
#   SSH_USER            - deploy-gebruiker op de VPS
#   SSH_PRIVATE_KEY     - private key die bij een authorized_key op de VPS hoort
#
# OAuth client aanmaken: admin console -> Trust credentials -> Credential -> OAuth
# (scopes: Auth keys read+write) -> Generate credential. ID + secret direct koperen.
# De runner joint als ephemeral Tailscale-node (tag:ci) en SSHt over het
# tailnet; poort 22 blijft gesloten voor het publieke internet.
# Op de VPS moet /opt/Foundation/.env bestaan met o.a. DATABASE_URL;
# de migratiestap sourceert dat bestand expliciet.
#
# De deploy is bewust simpel en veilig: pull -> deps -> migraties -> pm2 restart.
# Hij draait NIET op pull-requests, alleen op main.

name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Join tailnet als ephemeral CI-node
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.SSH_HOST }}

      - name: Deploy via SSH (over Tailscale)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e
            cd /opt/Foundation
            echo "==> Git pull"
            git fetch origin
            git reset --hard origin/main
            echo "==> Dependencies (server)"
            cd server && npm install --no-audit --no-fund && cd ..
            echo "==> Migraties (drizzle-kit)"
            cd db && npm install --no-audit --no-fund
            set -a
            . /opt/Foundation/.env
            set +a
            npx drizzle-kit migrate
            cd ..
            echo "==> Herstart processen"
            pm2 restart ecosystem.config.js --update-env || pm2 start ecosystem.config.js
            pm2 save
            echo "==> Smoke-check"
            # Bind-host en -port komen uit dezelfde .env als de server zelf
            # laadt (server/index.js: CHRONICLE_HOST/CHRONICLE_PORT, default
            # 127.0.0.1:4577). Tegen het verkeerde adres pollen geeft
            # curl exit 7 (connection refused) ook al draait de app prima —
            # vandaar dat de check hier de werkelijke binding volgt.
            HOST=$(grep -E '^CHRONICLE_HOST=' /opt/Foundation/.env | tail -1 | cut -d= -f2-)
            PORT=$(grep -E '^CHRONICLE_PORT=' /opt/Foundation/.env | tail -1 | cut -d= -f2-)
            HOST=${HOST:-127.0.0.1}
            PORT=${PORT:-4577}
            echo "Smoke-check against http://${HOST}:${PORT}"
            TOKEN=$(cat server/data/token.txt)

            # Readiness-loop in plaats van een vaste sleep: de memory-process
            # laadt een ~1.5-2GB ONNX-model vóórdat sidecar-routes antwoorden,
            # dus drie seconden is ruim onvoldoende na een koude start.
            for attempt in $(seq 1 30); do
              if curl -sf --connect-timeout 2 --max-time 5 \
                "http://${HOST}:${PORT}/api/settings/status" \
                -H "Authorization: Bearer $TOKEN" > /dev/null; then
                echo "API reageert - deploy OK"
                exit 0
              fi
              echo "API nog niet beschikbaar; poging ${attempt}/30"
              sleep 2
            done

            echo "API reageert NIET"
            echo "==> PM2 status"
            pm2 status
            echo "==> PM2 logs"
            pm2 logs chronicle --lines 100 --nostream
            exit 1