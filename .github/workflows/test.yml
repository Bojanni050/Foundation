# Snel feedback: de volledige testsuite op elke pull-request en push naar
# main. Los van de deploy — deploy.yml heeft dezelfde poort ingebouwd vóór
# dat er iets op de VPS gerold wordt. Alle tests zijn standalone (plain
# assert, eigen runner, geen DB): npm install volstaat, docker/vault nergens
# voor nodig.
name: Tests

on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm test
